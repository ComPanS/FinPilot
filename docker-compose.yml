services:
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    command: npx prisma db push
    env_file:
      - .env
    environment:
      # Use postgres service name (not localhost) in Docker network
      - DATABASE_URL=postgresql://${POSTGRES_USER:-finpilot}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-finpilot}
      - DIRECT_URL=postgresql://${POSTGRES_USER:-finpilot}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-finpilot}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        ADMIN_PATH: ${ADMIN_PATH}
        NEXT_PUBLIC_ADMIN_PATH: ${NEXT_PUBLIC_ADMIN_PATH:-${ADMIN_PATH}}
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      # Use postgres service name (not localhost) in Docker network
      - DATABASE_URL=postgresql://${POSTGRES_USER:-finpilot}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-finpilot}
      - DIRECT_URL=postgresql://${POSTGRES_USER:-finpilot}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-finpilot}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - AUTH_SECRET=${AUTH_SECRET}
      - AUTH_YANDEX_ID=${AUTH_YANDEX_ID}
      - AUTH_YANDEX_SECRET=${AUTH_YANDEX_SECRET}
      - NEUROAPI_API_KEY=${NEUROAPI_API_KEY}
      - NEUROAPI_BASE_URL=${NEUROAPI_BASE_URL:-https://neuroapi.host/v1}
      - NEUROAPI_MODEL=${NEUROAPI_MODEL:-grok-4-fast-non-reasoning}
      - YOOKASSA_SHOP_ID=${YOOKASSA_SHOP_ID}
      - YOOKASSA_SECRET_KEY=${YOOKASSA_SECRET_KEY}
      - UPSTASH_REDIS_REST_URL=${UPSTASH_REDIS_REST_URL}
      - UPSTASH_REDIS_REST_TOKEN=${UPSTASH_REDIS_REST_TOKEN}
      - AUTH_TRUST_HOST=true
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:3000}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      - CRON_SECRET=${CRON_SECRET}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_FROM=${SMTP_FROM}
      - ADMIN_PATH=${ADMIN_PATH}
      - ADMIN_ALLOWED_EMAILS=${ADMIN_ALLOWED_EMAILS}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/api/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  postgres:
    image: postgres:16-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-finpilot}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-finpilot}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-finpilot} -d ${POSTGRES_DB:-finpilot}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
